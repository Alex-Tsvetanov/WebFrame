<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Task Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #f0f2f5; display: flex; align-items: center;
               justify-content: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; padding: 2.5rem;
                width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
        h1 { font-size: 1.6rem; margin-bottom: 0.4rem; color: #1a1a2e; }
        p.sub { color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600;
                color: #444; margin-bottom: 0.4rem; }
        input { width: 100%; padding: 0.7rem 1rem; border: 1.5px solid #ddd;
                border-radius: 8px; font-size: 1rem; margin-bottom: 1.2rem;
                transition: border-color .2s; }
        input:focus { outline: none; border-color: #6c63ff; }
        button { width: 100%; padding: 0.8rem; background: #6c63ff; color: #fff;
                 border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
                 cursor: pointer; transition: background .2s; }
        button:hover { background: #574fd6; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #error { display: none; background: #fff0f0; border: 1px solid #f5c0c0;
                 color: #c0392b; padding: 0.7rem 1rem; border-radius: 8px;
                 margin-bottom: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Task Dashboard</h1>
        <p class="sub">Sign in to manage your tasks</p>
        {% if error and error != "" %}
        <div id="error" style="display:block">{{ error }}</div>
        {% endif %}
        <div id="js-error" id="error"></div>
        <form id="login-form">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="demo" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            <button id="submit-btn" type="submit">Sign In</button>
        </form>
        <p style="margin-top:1rem;font-size:.85rem;color:#888;text-align:center">
            Demo credentials: <strong>demo</strong> / <strong>demo123</strong>
        </p>
    </div>
    <script>
        const form = document.getElementById('login-form');
        const errEl = document.getElementById('js-error');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in…';

            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (resp.ok) {
                    window.location.href = '/';
                } else {
                    const data = await resp.json();
                    errEl.textContent = data.error?.message ?? 'Login failed';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = 'Network error. Please try again.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
