name: Benchmark & Performance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          g++-12 \
          wrk \
          apache2-utils

    - name: Configure CMake (Release with optimizations)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=gcc-12 \
          -DCMAKE_CXX_COMPILER=g++-12 \
          -DCMAKE_CXX_FLAGS="-O3 -march=native -flto" \
          -DCOROUTE_BUILD_EXAMPLES=ON \
          -DCOROUTE_BUILD_TESTS=OFF \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON \
          -DCOROUTE_ENABLE_SIMDJSON=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Benchmark Server
      run: |
        set -eo pipefail
        # io_uring locks kernel memory for each ring's SQ/CQ buffers. The
        # benchmark server defaults to 12 worker threads, one ring each, at
        # queue depth 8192 (src/net/io_uring/uring_context.cpp). That is more
        # locked memory than the runner's default RLIMIT_MEMLOCK allows, so
        # ring init starts failing partway through startup with ENOMEM
        # ("Failed to initialize io_uring ring 10" - the 11th ring). Raise the
        # limit for this shell so the server process launched below inherits it.
        echo "ulimit -l (memlock, KB) before: $(ulimit -l)"
        sudo prlimit --pid $$ --memlock=unlimited:unlimited 2>/dev/null || true
        ulimit -l unlimited 2>/dev/null || true
        echo "ulimit -l (memlock, KB) after: $(ulimit -l)"

        # Redirected to a file and disowned: without this, the server's stdout is
        # inherited from this step's shell. When the step ends the shell exits, and
        # a process that later writes to a closed inherited pipe gets SIGPIPE. It is
        # also disowned so it is not a job-controlled child of a shell that is about
        # to exit, which some runner images clean up between steps.
        if [ -f build/examples/Samples/benchmark_server/benchmark_server ]; then
          BIN=build/examples/Samples/benchmark_server/benchmark_server
        else
          echo "Benchmark server not found, using hello_world"
          BIN=build/examples/Samples/hello_world/hello_world
        fi
        "./$BIN" > server.log 2>&1 &
        BENCH_PID=$!
        disown
        echo "BENCH_PID=$BENCH_PID" >> $GITHUB_ENV

    - name: Wait for server to start
      run: |
        set -eo pipefail
        # The previous version of this loop had no failure path: if the server never
        # answered, the loop just ended and the step still exited 0. Every later step
        # then ran wrk and ab against a dead port, which is exactly why a "successful"
        # run once produced an artifact with two empty wrk sections and ab hung on its
        # first connection. A dead server must fail the job here, not downstream.
        ready=0
        for i in $(seq 1 30); do
          if curl -sf --max-time 2 http://localhost:8080/ > /dev/null; then
            echo "Server is ready after ${i}s"
            ready=1
            break
          fi
          if ! kill -0 "$BENCH_PID" 2>/dev/null; then
            echo "::error::Benchmark server process (pid $BENCH_PID) died before becoming ready."
            echo "--- server.log ---"
            cat server.log || true
            exit 1
          fi
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "::error::Server never answered on :8080 after 30s."
          echo "--- server.log ---"
          cat server.log || true
          exit 1
        fi

    - name: Run wrk benchmark
      run: |
        set -eo pipefail
        mkdir -p benchmark-results

        echo "=== Simple GET Benchmark ===" | tee benchmark-results/results.txt
        wrk -t4 -c100 -d30s http://localhost:8080/ | tee -a benchmark-results/results.txt

        echo -e "\n=== Keep-Alive Benchmark ===" | tee -a benchmark-results/results.txt
        wrk -t4 -c100 -d30s -H "Connection: keep-alive" http://localhost:8080/ | tee -a benchmark-results/results.txt

        echo -e "\n=== Apache Bench Results ===" | tee -a benchmark-results/results.txt
        ab -n 10000 -c 100 -k http://localhost:8080/ | tee -a benchmark-results/results.txt

    - name: Stop benchmark server
      if: always()
      run: |
        if [ -n "$BENCH_PID" ]; then
          kill "$BENCH_PID" 2>/dev/null || true
        fi

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results/
        if-no-files-found: warn

    - name: Upload server log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-server-log
        path: server.log
        if-no-files-found: warn
    
    - name: Performance Summary
      run: |
        echo "### Performance Benchmark Results :rocket:" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat benchmark-results/results.txt >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
  
  deploy-benchmark:
    name: Deploy Benchmark Results
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download benchmark results
      uses: actions/download-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results/
    
    - name: Generate HTML report
      run: |
        mkdir -p benchmark-html
        cat > benchmark-html/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
          <title>Coroute Performance Benchmarks</title>
          <style>
            body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
            h1 { color: #333; }
            pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; }
            .timestamp { color: #666; font-size: 0.9em; }
          </style>
        </head>
        <body>
          <h1>Coroute v2 Performance Benchmarks</h1>
          <p class="timestamp">Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")</p>
          <p>Commit: <code>${GITHUB_SHA:0:7}</code></p>
          <pre>
        EOF
        cat benchmark-results/results.txt >> benchmark-html/index.html
        cat >> benchmark-html/index.html << 'EOF'
          </pre>
        </body>
        </html>
        EOF
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./benchmark-html
        destination_dir: benchmark
        commit_message: "Update benchmark results for ${{ github.sha }}"
