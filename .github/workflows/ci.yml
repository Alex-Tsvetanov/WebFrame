name: CI Build & Test

on:
  push:
    branches: [ main, master, develop ]
    paths: ['**.cpp', '**.hpp', '**.cc', '**.hh', '**.c', '**.h', '**.cmake', '**/CMakeLists.txt', '.clang-format', '.clang-tidy', '.github/workflows/ci.yml']
  pull_request:
    branches: [ main, master, develop ]
    paths: ['**.cpp', '**.hpp', '**.cc', '**.hh', '**.c', '**.h', '**.cmake', '**/CMakeLists.txt', '.clang-format', '.clang-tidy', '.github/workflows/ci.yml']

jobs:
  build-linux:
    name: Build on Linux (GCC & Clang)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - { cc: gcc-14, cxx: g++-14 }
          - { cc: clang-18, cxx: clang++-18 }
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          ${{ matrix.compiler.cc }} \
          ${{ matrix.compiler.cxx }}
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
          -DCOROUTE_BUILD_EXAMPLES=ON \
          -DCOROUTE_BUILD_TESTS=ON \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON \
          -DCOROUTE_ENABLE_SIMDJSON=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake ninja openssl zlib
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCOROUTE_BUILD_EXAMPLES=ON \
          -DCOROUTE_BUILD_TESTS=ON \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON \
          -DCOROUTE_ENABLE_SIMDJSON=ON \
          -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Setup Dev Shell
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Install dependencies
      run: |
        vcpkg install zlib:x64-windows openssl:x64-windows
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCOROUTE_BUILD_EXAMPLES=ON `
          -DCOROUTE_BUILD_TESTS=ON `
          -DCOROUTE_ENABLE_TLS=ON `
          -DCOROUTE_ENABLE_HTTP2=ON `
          -DCOROUTE_ENABLE_SIMDJSON=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  sanitizers:
    name: Sanitizer Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Preset names from CMakePresets.json. asan bundles UBSan; running them
        # separately doubles the job count for no extra coverage. They cannot be
        # combined with tsan.
        preset: [asan, tsan]

    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          clang-18 \
          llvm-18

    # Examples must be ON. With them OFF the server itself is never instrumented,
    # so the coroutine frame lifetime bugs ASan exists to catch here are structurally
    # unreachable and the job only proves the unit tests are clean.
    - name: Configure, build and test
      run: cmake --workflow --preset ${{ matrix.preset }}
      env:
        CC: clang-18
        CXX: clang++-18

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck
    
    # --error-exitcode=1 was previously followed by "|| true", which made the exit
    # code meaningless and turned this job into a report generator. It now fails.
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --std=c++23 \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          -I include/ \
          src/ include/ \
          --error-exitcode=1 \
          --xml --xml-version=2 2> cppcheck-report.xml

    - name: Upload cppcheck report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: cppcheck-report
        path: cppcheck-report.xml
  cpp-linter:
    name: C++ Linter (Clang-Format & Clang-Tidy)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev liburing-dev zlib1g-dev

      - name: Generate Compilation Database
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCOROUTE_BUILD_EXAMPLES=ON \
            -DCOROUTE_BUILD_TESTS=ON \
            -DCOROUTE_ENABLE_TLS=ON \
            -DCOROUTE_ENABLE_HTTP2=ON \
            -DCOROUTE_ENABLE_SIMDJSON=ON

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          tidy-checks: ''
          # Pinned. clang-tidy gained checks after 18 that fire heavily on this
          # codebase, so an unpinned version would change the gate under us.
          version: '18'
          database: 'build'
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          ignore: 'external|build|_deps|lib|benchmark|doc'
          # Scoped to changed lines. The tree carries a historical backlog of
          # clang-tidy findings; gating the whole tree would mean the job could
          # never be green, which is how it ended up continue-on-error in the first
          # place. Gating the diff makes it a real gate for everything new.
          files-changed-only: true
          lines-changed-only: true
          extra-args: '-std=c++23'

      # This is what makes the job a gate rather than a report.
      - name: Fail on lint findings
        if: steps.linter.outputs.checks-failed > 0
        run: |
          echo "clang-format/clang-tidy reported ${{ steps.linter.outputs.checks-failed }} findings on changed lines."
          exit 1

  fuzz:
    name: Fuzz Harnesses (regression + short run)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          clang-18 \
          llvm-18

    - name: Build harnesses
      run: cmake --preset fuzz && cmake --build build/fuzz
      env:
        CC: clang-18
        CXX: clang++-18

    # Two different things, and only the first is a gate in the usual sense.
    #
    # Replaying the committed corpus is deterministic: every input that has ever
    # been interesting is executed once, including the three named seeds that
    # reproduce the HPACK decompression bomb and the two chunk-size defects. If a
    # change reintroduces one of those, this fails on the same input that found it.
    #
    # The short exploratory run afterwards is not deterministic and is not expected
    # to find anything on most commits. It is here because a corpus only stays
    # useful if something keeps adding to it, and thirty seconds per harness is
    # cheap enough to spend on the chance.
    - name: Replay the committed corpus
      run: |
        set -e
        for harness in build/fuzz/fuzz/fuzz_*; do
          name=$(basename "$harness" | sed 's/^fuzz_//')
          echo "::group::replay $name"
          "$harness" -runs=0 "fuzz/corpus/$name"
          echo "::endgroup::"
        done

    - name: Short exploratory run
      run: |
        set -e
        for harness in build/fuzz/fuzz/fuzz_*; do
          name=$(basename "$harness" | sed 's/^fuzz_//')
          echo "::group::explore $name"
          "$harness" "fuzz/corpus/$name" -max_total_time=30 -max_len=4096
          echo "::endgroup::"
        done

    # A crash artifact is written to the working directory, so anything here is a
    # finding worth keeping rather than re-deriving.
    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: fuzz-artifacts
        path: |
          crash-*
          timeout-*
          oom-*
        if-no-files-found: ignore
