name: CI Build & Test

on:
  push:
    branches: [ main, master, develop ]
    paths: ['**.cpp', '**.hpp', '**.cc', '**.hh', '**.c', '**.h', '**.cmake', '**/CMakeLists.txt', '.clang-format', '.clang-tidy', '.github/workflows/ci.yml']
  pull_request:
    branches: [ main, master, develop ]
    paths: ['**.cpp', '**.hpp', '**.cc', '**.hh', '**.c', '**.h', '**.cmake', '**/CMakeLists.txt', '.clang-format', '.clang-tidy', '.github/workflows/ci.yml']

jobs:
  build-linux:
    name: Build on Linux (GCC & Clang)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler:
          - { cc: gcc-14, cxx: g++-14 }
          - { cc: clang-18, cxx: clang++-18 }
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          ${{ matrix.compiler.cc }} \
          ${{ matrix.compiler.cxx }}
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} \
          -DCOROUTE_BUILD_EXAMPLES=ON \
          -DCOROUTE_BUILD_TESTS=ON \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON \
          -DCOROUTE_ENABLE_SIMDJSON=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        brew install cmake ninja openssl zlib
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCOROUTE_BUILD_EXAMPLES=ON \
          -DCOROUTE_BUILD_TESTS=ON \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON \
          -DCOROUTE_ENABLE_SIMDJSON=ON \
          -DOPENSSL_ROOT_DIR=/usr/local/opt/openssl
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Setup Dev Shell
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Install dependencies
      run: |
        vcpkg install zlib:x64-windows openssl:x64-windows
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DCOROUTE_BUILD_EXAMPLES=ON `
          -DCOROUTE_BUILD_TESTS=ON `
          -DCOROUTE_ENABLE_TLS=ON `
          -DCOROUTE_ENABLE_HTTP2=ON `
          -DCOROUTE_ENABLE_SIMDJSON=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --parallel

  sanitizers:
    name: Sanitizer Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [address, thread, undefined]
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          libssl-dev \
          zlib1g-dev \
          liburing-dev \
          clang-18 \
          llvm-18
    
    - name: Configure CMake with Sanitizer
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang-18 \
          -DCMAKE_CXX_COMPILER=clang++-18 \
          -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -g" \
          -DCOROUTE_BUILD_EXAMPLES=OFF \
          -DCOROUTE_BUILD_TESTS=ON \
          -DCOROUTE_ENABLE_TLS=ON \
          -DCOROUTE_ENABLE_HTTP2=ON
    
    - name: Build
      run: cmake --build build --parallel
    
    - name: Run Tests with Sanitizer
      run: |
        cd build
        ctest --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1
        UBSAN_OPTIONS: print_stacktrace=1

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Install cppcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inconclusive --std=c++20 \
          --suppress=missingIncludeSystem \
          --suppress=unusedFunction \
          -I include/ \
          src/ include/ \
          --error-exitcode=1 \
          --xml --xml-version=2 2> cppcheck-report.xml || true
    
    - name: Upload cppcheck report
      uses: actions/upload-artifact@v6
      with:
        name: cppcheck-report
        path: cppcheck-report.xml
  cpp-linter:
    name: C++ Linter (Clang-Format & Clang-Tidy)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: 
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev liburing-dev zlib1g-dev

      - name: Generate Compilation Database
        run: |
          cmake -S . -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCOROUTE_BUILD_EXAMPLES=ON \
            -DCOROUTE_BUILD_TESTS=ON \
            -DCOROUTE_ENABLE_TLS=ON \
            -DCOROUTE_ENABLE_HTTP2=ON \
            -DCOROUTE_ENABLE_SIMDJSON=ON

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          tidy-checks: ''
          version: '18'
          database: 'build'
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
          ignore: 'external|build|_deps'
          files-changed-only: false
          lines-changed-only: false
          extra-args: '-std=c++20'
